backend:
  name: git-gateway
  branch: principal

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Articles"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Date de publication", name: "date", widget: "datetime"}
      - {label: "Image à la une", name: "image", widget: "image", required: false}
      - {label: "Contenu", name: "body", widget: "markdown"}

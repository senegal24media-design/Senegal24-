<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Sénégal 24</title>
  
  <link rel="icon" type="image/png" href="logo.png">

  <meta name="description" content="Contactez la rédaction de Sénégal 24 pour vos demandes d'informations, propositions d'articles ou partenariats.">
  <meta name="keywords" content="Sénégal 24, contact, rédaction, Dakar, information">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Contact - Sénégal 24">
  <meta property="og:description" content="Prenez contact avec l'équipe de Sénégal 24.">
  <meta property="og:image" content="logo.png">

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --primary-color: #e50914;
      --card-bg: #f4f4f4;
      --header-bg: #0f172a;
      --header-text: #ffffff;
      --input-bg: #ffffff;
      --border-color: #cccccc;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --card-bg: #1e293b;
      --header-bg: #020617;
      --header-text: #ffffff;
      --input-bg: #0f172a;
      --border-color: #334155;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      background-color: var(--header-bg);
      color: var(--header-text);
      padding: 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary-color);
      text-decoration: none;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    nav a {
      color: var(--header-text);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
    }

    nav a.active {
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
    }

    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--header-text);
      padding: 0 5px;
    }

    main {
      padding: 1.5rem;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      color: var(--primary-color);
      font-size: 1.8rem;
    }

    .contact-container {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 8px;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .form-group input, 
    .form-group textarea {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background-color: var(--input-bg);
      color: var(--text-color);
      box-sizing: border-box;
      font-family: inherit;
    }

    button.btn-submit {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }

    footer {
      background-color: var(--header-bg);
      color: var(--header-text);
      text-align: center;
      padding: 1.5rem;
      margin-top: 3rem;
    }

    .social-links {
      margin-top: 10px;
    }

    .social-links a {
      color: var(--header-text);
      margin: 0 8px;
      text-decoration: none;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">SÉNÉGAL 24</a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="actualites.html">Actualités</a>
      <a href="contact.html" class="active">Contact</a>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </nav>
  </header>

  <main>
    <h1>Contactez-nous</h1>
    
    <div class="contact-container">
      <form onsubmit="event.preventDefault(); alert('Message envoyé avec succès !');">
        <div class="form-group">
          <label for="name">Nom complet</label>
          <input type="text" id="name" required placeholder="Votre nom">
        </div>

        <div class="form-group">
          <label for="email">Adresse E-mail</label>
          <input type="email" id="email" required placeholder="votre.email@exemple.com">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" required placeholder="Écrivez votre message ici..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Envoyer le message</button>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Sénégal 24 - Tous droits réservés.</p>
    <div class="social-links">
      <a href="#">Facebook</a> | 
      <a href="#">X (Twitter)</a> | 
      <a href="#">YouTube</a>
    </div>
  </footer>

  <script>
    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme');
      const btn = document.getElementById('themeBtn');
      
      if (currentTheme === 'dark') {
        document.body.removeAttribute('data-theme');
        btn.textContent = '🌙';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        btn.textContent = '☀️';
      }
    }
  </script>

</body>
</html>

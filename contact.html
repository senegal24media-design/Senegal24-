<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Sénégal 24</title>
  <link rel="icon" type="image/png" href="logo.png">

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #1a1a1a;
      --primary-color: #e50914;
      --card-bg: #f4f4f4;
      --header-bg: #0f172a;
      --header-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --card-bg: #1e293b;
      --header-bg: #020617;
      --header-text: #ffffff;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
      line-height: 1.6;
    }

    header {
      background-color: var(--header-bg);
      color: var(--header-text);
      padding: 0.8rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-img {
      height: 45px;
      width: 45px;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    nav a {
      color: var(--header-text);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }

    nav a.active {
      color: var(--primary-color);
      border-bottom: 2px solid var(--primary-color);
    }

    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--header-text);
      padding: 0 2px;
    }

    main {
      padding: 1.5rem;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      color: var(--primary-color);
    }

    .contact-card {
      background-color: var(--card-bg);
      padding: 1.5rem;
      border-radius: 8px;
    }

    .contact-card p {
      margin: 0.8rem 0;
      font-size: 1.05rem;
    }

    .contact-card a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      background-color: var(--header-bg);
      color: var(--header-text);
      text-align: center;
      padding: 1.5rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">
      <img src="logo.png" alt="Sénégal 24" class="logo-img">
    </a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="actualites.html">Actualités</a>
      <a href="contact.html" class="active">Contact</a>
      <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </nav>
  </header>

  <main>
    <h1>Contactez-nous</h1>
    <div class="contact-card">
      <p>Pour toute information, proposition d'article ou partenariat, contactez la rédaction de Sénégal 24 :</p>
      <p><strong>Téléphone / WhatsApp :</strong> <a href="tel:+221772875612">+221 77 287 56 12</a></p>
      <p><strong>Email :</strong> <a href="mailto:kebealiou685@gmail.com">kebealiou685@gmail.com</a></p>
      <p><strong>Adresse :</strong> Dakar, Sénégal</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Sénégal 24 - Tous droits réservés.</p>
  </footer>

  <script>
    function toggleTheme() {
      const currentTheme = document.body.getAttribute('data-theme');
      const btn = document.getElementById('themeBtn');
      
      if (currentTheme === 'dark') {
        document.body.removeAttribute('data-theme');
        btn.textContent = '🌙';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        btn.textContent = '☀️';
      }
    }
  </script>

</body>
</html>
